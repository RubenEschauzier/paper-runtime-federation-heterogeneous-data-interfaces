<svg xmlns="http://www.w3.org/2000/svg" width="140pt" height="100pt" viewBox="0 0 140 100"
     font-family="Linux Libertine O, DejaVu Sans, serif" font-size="7">
  <!-- Eddy with symmetric hash joins for t1-t3 and t3-t2 (cf. Deshpande & Hellerstein, VLDB 2004, Fig. 2).
       Routing history split the t3 state into t3' and t3''. Tuples t1t2 from composite c can be routed
       to either join, but each probes only part of t3. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- inputs -->
  <g font-style="italic" text-anchor="middle">
    <text x="4" y="38">t<tspan font-size="5" font-style="normal" dy="1.5">1</tspan></text>
    <text x="4" y="50">t<tspan font-size="5" font-style="normal" dy="1.5">2</tspan></text>
    <text x="4" y="62">t<tspan font-size="5" font-style="normal" dy="1.5">3</tspan></text>
  </g>
  <g stroke="#000" stroke-width="0.6" fill="none">
    <line x1="10" y1="36" x2="28.5" y2="42.5" marker-end="url(#arr)"/>
    <line x1="10" y1="48" x2="27" y2="47" marker-end="url(#arr)"/>
    <line x1="10" y1="60" x2="29" y2="51.5" marker-end="url(#arr)"/>
    <!-- output -->
    <line x1="48" y1="46" x2="82" y2="46" marker-end="url(#arr)"/>
    <!-- routing to the two joins -->
    <line x1="46" y1="40" x2="83" y2="26" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="46" y1="52" x2="83" y2="66" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text x="66" y="44" text-anchor="middle" font-size="6">output</text>

  <!-- eddy -->
  <circle cx="38" cy="46" r="10" fill="#fff" stroke="#000" stroke-width="0.6"/>
  <text x="38" y="48.5" text-anchor="middle" font-size="6.5">Eddy</text>

  <!-- join t1 - t3 -->
  <rect x="84" y="14" width="56" height="20" fill="#fff" stroke="#000" stroke-width="0.6"/>
  <rect x="87" y="17" width="23" height="14" fill="#eee" stroke="#000" stroke-width="0.5"/>
  <rect x="114" y="17" width="23" height="14" fill="#eee" stroke="#000" stroke-width="0.5"/>
  <g font-style="italic" text-anchor="middle">
    <text x="98.5" y="26">t<tspan font-size="5" font-style="normal" dy="1.5">1</tspan></text>
    <text x="125.5" y="26">t<tspan font-size="5" font-style="normal" dy="1.5">3</tspan><tspan font-style="normal" dy="-2.6" dx="0.2">′</tspan></text>
  </g>
  <text x="112" y="10" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan font-size="5" dy="1.5">1</tspan><tspan dy="-1.5" dx="1.5" font-family="DejaVu Sans" font-size="7">⋈</tspan><tspan font-style="italic" dx="1.5">t</tspan><tspan font-size="5" dy="1.5">3</tspan></text>

  <!-- join t3 - t2 -->
  <rect x="84" y="58" width="56" height="20" fill="#fff" stroke="#000" stroke-width="0.6"/>
  <rect x="87" y="61" width="23" height="14" fill="#eee" stroke="#000" stroke-width="0.5"/>
  <rect x="114" y="61" width="23" height="14" fill="#eee" stroke="#000" stroke-width="0.5"/>
  <g font-style="italic" text-anchor="middle">
    <text x="98.5" y="70">t<tspan font-size="5" font-style="normal" dy="1.5">3</tspan><tspan font-style="normal" dy="-2.6" dx="0.2">″</tspan></text>
    <text x="125.5" y="70">t<tspan font-size="5" font-style="normal" dy="1.5">2</tspan></text>
  </g>
  <text x="112" y="89" text-anchor="middle"><tspan font-style="italic">t</tspan><tspan font-size="5" dy="1.5">3</tspan><tspan dy="-1.5" dx="1.5" font-family="DejaVu Sans" font-size="7">⋈</tspan><tspan font-style="italic" dx="1.5">t</tspan><tspan font-size="5" dy="1.5">2</tspan></text>

  <!-- composite source found at T, delivering t1t2 tuples -->
  <rect x="10" y="70" width="46" height="20" fill="#fff" stroke="#000" stroke-width="0.6"/>
  <text x="33" y="78.5" text-anchor="middle" font-size="6.5">composite <tspan font-style="italic">c</tspan></text>
  <text x="33" y="86.5" text-anchor="middle" font-size="6.5"><tspan font-style="italic">t</tspan><tspan font-size="4.5" dy="1.3">1</tspan><tspan dy="-1.3" dx="1.2" font-family="DejaVu Sans" font-size="6">⋈</tspan><tspan font-style="italic" dx="1.2">t</tspan><tspan font-size="4.5" dy="1.3">2</tspan></text>
  <text x="33" y="97.5" text-anchor="middle" font-size="6" font-style="italic">found at T</text>
  <line x1="35" y1="70" x2="37.3" y2="57.5" stroke="#000" stroke-width="0.6"
        stroke-dasharray="2,1.5" marker-end="url(#arr)"/>

  <!-- t1t2 tuples routed to the t1-t3 join probe only t3' -->
  <path d="M40,36 Q50,14 83,17" stroke="#000" stroke-width="0.6" stroke-dasharray="2,1.5"
        fill="none" marker-end="url(#arr)"/>
  <text x="52" y="17" text-anchor="middle" font-size="6.5" font-style="italic">t<tspan font-size="4.5" font-style="normal" dy="1.3">1</tspan><tspan dy="-1.3">t</tspan><tspan font-size="4.5" font-style="normal" dy="1.3">2</tspan></text>
</svg>
